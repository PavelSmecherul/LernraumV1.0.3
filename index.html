const vocabulary=text=>text.split('|').map(pair=>pair.split('='));
// Match a headword already taught with an article or singular/plural pair.
// Existing cards keep their IDs, wording and order so saved reviews remain valid.
const vocabularyKey=text=>text.normalize('NFC').trim().toLowerCase().replace(/^(der|die|das)\s+/,'').replace(/[.!?…]/g,'').replace(/\s+/g,' ');
const withFullVocabulary=u=>{
 const chapter=chapters.find(c=>c.id===u.id.slice(0,3)),book=textbookVocabulary[u.id];
 const deck=u.words.map(([front,back],i)=>({id:`${u.id}-${i}`,unit:u.id,front,back}));
 const byWord=new Map();
 for(const card of deck)for(const alias of [card.front,...card.front.split(' / ')])byWord.set(vocabularyKey(alias),card);
 const vocabularyCoverage=book.entries.map(entry=>({row:entry.row,terms:entry.terms.map((term,i)=>{
  let card=byWord.get(vocabularyKey(term));
  if(!card){card={id:`${u.id}-vocab-${entry.row}-${i+1}`,unit:u.id,front:term,back:entry.meanings[i]};deck.push(card);byWord.set(vocabularyKey(term),card);}
  return {term,cardId:card.id};
 })}));
 return {...u,words:deck.map(c=>[c.front,c.back]),deck,vocabularyCoverage,vocabularyPage:book.page,code:u.id,chapter:chapter.id,icon:chapter.icon,color:chapter.color,minutes:15,pages:[u.page,u.page+1],pdfPages:[u.page+2,u.page+3]};
};

 {id:'1.2b',title:'Ein typischer Schultag',subtitle:'School routines & irregular verbs',page:22,description:'Describe a typical school day and practise common irregular present-tense verbs.',
 lesson:{title:'From the first bell to home time.',intro:'Describe when your school day starts, what happens during breaks and how the day ends. Some common verbs change their vowel with du and er/sie/es.',rule:'Present-tense vowel changes include helfen → du hilfst / er hilft, lesen → du liest / er liest, sprechen → du sprichst / er spricht, and essen → du isst / er isst.',points:['The wir, ihr and sie plural forms usually keep the original vowel: wir lesen, ihr lest, sie lesen.','Sein and haben have special forms: ich bin, du bist, er ist; ich habe, du hast, er hat.','German halb counts towards the next hour: halb acht is 7:30, halb drei is 2:30.'],examples:[['Der Unterricht beginnt um halb acht.','Lessons begin at half past seven.'],['In der Pause isst sie ein Brötchen.','During the break she eats a bread roll.'],['Unser Lehrer hilft uns.','Our teacher helps us.']],tip:'Learn irregular verbs as small sets: lesen, du liest, er liest.'},
 words:vocabulary('der Schultag=school day|der Unterricht=lessons / teaching|die Pause=break|beginnen=to begin|enden=to end|helfen=to help|lesen=to read|sprechen=to speak|essen=to eat|sehen=to see|vergessen=to forget|haben=to have|sein=to be|die Kantine=canteen|die Bibliothek=library|der Lehrer=male teacher|die Lehrerin=female teacher|halb acht=half past seven|nach der Schule=after school|pünktlich=punctual / on time'),
 speaking:'Describe the beginning and end of your school day, your breaks and one thing you enjoy.',writing:'Write a short blog about your ideal school day. Include times, subjects, teachers and what students do during breaks.',
 exercises:[['fill','Er ___ ein Buch. (lesen)',['liest'],'Lesen changes e to ie for du and er/sie/es.'],['translate','Translate: the break',['die Pause'],'Pause is feminine.'],['order','Build: Our teacher helps us.',['Unser','Lehrer','hilft','uns'],'Helfen becomes hilft with er or a singular teacher.'],['choice','What time is halb acht?',['7:30','8:30','8:00','7:00'],'Halb acht is halfway towards eight: 7:30.'],['fill','Du ___ Deutsch. (sprechen)',['sprichst'],'Sprechen changes e to i with du.'],['translate','Translate: after school',['nach der Schule'],'Nach takes the dative: der Schule.'],['order','Build: She eats in the break.',['Sie','isst','in','der','Pause'],'Essen becomes isst with sie meaning she.'],['choice','Which form completes Wir ___ ein Buch?',['lesen','liest','lese','lest'],'Wir uses lesen, with no vowel change.']]},
 {id:'1.2c',title:'Meine Schulgebäude',subtitle:'School buildings & facilities',page:24,description:'Describe school facilities and use accusative prepositions such as für, ohne and durch.',
 lesson:{title:'Find your way around school.',intro:'Name school rooms, explain what they are for and describe their condition. You can use these phrases to compare your own school with an ideal school.',rule:'Für, ohne, durch, gegen, um and bis are accusative prepositions. Masculine der and ein become den and einen: durch den Schulhof, für einen Musiksaal.',points:['Feminine die and neuter das stay unchanged in the accusative: für die Aula, ohne das Labor.','Entlang normally follows an accusative noun when describing a route: den Korridor entlang.','Describe facilities with modern, hell, ruhig or gut ausgestattet. Give a reason for your opinion.'],examples:[['Wir gehen durch den Schulhof.','We walk through the school playground.'],['Das ist ein Raum für die Lehrer.','That is a room for the teachers.'],['Unsere Bibliothek ist gut ausgestattet.','Our library is well equipped.']],tip:'Für is followed by the accusative even when its English meaning is simply for.'},
 words:vocabulary('das Schulgebäude=school building|das Schulbüro=school office|das Lehrerzimmer=staffroom|der Schulhof=school playground|das Klassenzimmer=classroom|der Musiksaal=music room|der Umkleideraum=changing room|die Turnhalle=gym / sports hall|die Bibliothek=library|die Aula=assembly hall|das Labor=laboratory|das Computerzimmer=computer room|der Eingang=entrance|der Korridor=corridor|das Treppenhaus=stairwell|gut ausgestattet=well equipped|modern=modern|altmodisch=old-fashioned|durch=through|ohne=without|für=for|entlang=along'),
 speaking:'Give an exchange student a tour of your school. Describe at least four facilities and say what you like or would improve.',writing:'Write a positive description of your school for a poster. Include its buildings, facilities and surroundings, plus your opinions.',
 exercises:[['fill','Wir gehen durch ___ Schulhof. (der)',['den'],'Durch takes the accusative, so der Schulhof becomes den Schulhof.'],['translate','Translate: the staffroom',['das Lehrerzimmer'],'Lehrerzimmer is the room for teachers.'],['order','Build: We walk along the corridor.',['Wir','gehen','den','Korridor','entlang'],'Entlang follows den Korridor here.'],['choice','Which room is die Turnhalle?',['the sports hall','the staffroom','the laboratory','the school office'],'Turnhalle is a gym or sports hall.'],['fill','Das Geld ist für ___ neuen Musiksaal. (ein)',['einen'],'Für requires the accusative; Musiksaal is masculine.'],['translate','Translate: well equipped',['gut ausgestattet'],'Gut ausgestattet is useful for describing school facilities.'],['order','Build: We have a modern library.',['Wir','haben','eine','moderne','Bibliothek'],'Bibliothek is feminine and the direct object of haben.'],['choice','Which phrase is grammatically correct?',['ohne einen Computer','ohne einem Computer','ohne ein Computer','ohne einer Computer'],'Ohne takes the accusative: einen Computer.']]},
 {id:'1.2d',title:'Das Schulleben in den deutschsprachigen Ländern',subtitle:'School exchanges & asking questions',page:26,description:'Discuss school life and exchanges, form questions and compare school experiences.',
 lesson:{title:'Ask, compare, discover.',intro:'An exchange is a chance to ask about a different school routine. Use questions to learn about lesson times, clothing, meals, trips and your host family. Routines vary between schools.',rule:'In a yes/no question, the conjugated verb comes first: Tragt ihr eine Uniform? With a question word, the verb follows it: Wann beginnt der Unterricht?',points:['Question words: wer (who), was (what), wann (when), wo (where), wohin (where to), wie (how), warum (why).','Wo asks for location; wohin asks for a destination.','Seit wann asks since when: Seit wann lernst du Deutsch?'],examples:[['Wann beginnt eure Schule?','When does your school start?'],['Habt ihr eine Kantine?','Do you have a canteen?'],['Wohin geht der Ausflug?','Where is the trip going?']],tip:'Use the textbook’s school examples to practise comparisons, rather than assuming every school has the same rules.'},
 words:vocabulary('das Schulleben=school life|der Schüleraustausch=school exchange|die Gastfamilie=host family|der Austauschpartner=male exchange partner|die Austauschpartnerin=female exchange partner|der Ausflug=trip / excursion|die Schuluniform=school uniform|die Kleidung=clothes|die Schreibwaren=stationery|das Heimweh=homesickness|aufgeregt=excited / nervous|erschöpft=exhausted|verantwortlich=responsible|wer=who|wann=when|warum=why|wohin=where to|seit wann=since when|vergleichen=to compare|anders=different'),
 speaking:'Role-play an exchange visit. Ask about the school day, meals, uniform, your host family and a planned trip.',writing:'Write 130–140 words to an exchange partner. Describe a typical school day, likes and dislikes, compare school routines and explain your preferences.',
 exercises:[['fill','___ beginnt der Unterricht? – Um acht Uhr.',['Wann'],'Wann asks when something happens.'],['translate','Translate: the host family',['die Gastfamilie'],'Gastfamilie is the family hosting a visitor.'],['order','Build: Do you have a canteen? (ihr)',['Habt','ihr','eine','Kantine'],'The verb comes first in a yes/no question.'],['choice','Which question word asks for a destination?',['wohin','wo','wer','seit wann'],'Wohin means where to; wo asks where something is.'],['fill','___ lernst du Deutsch? – Weil ich Sprachen mag.',['Warum'],'A reason introduced by weil answers warum.'],['translate','Translate: the school exchange',['der Schüleraustausch'],'Schüleraustausch means a school or pupil exchange.'],['order','Build: What is your host family called? (du)',['Wie','heißt','deine','Gastfamilie'],'Wie heißt …? asks what someone is called.'],['choice','Which is a correctly formed yes/no question?',['Tragt ihr eine Uniform?','Ihr tragt eine Uniform? wann','Eine Uniform ihr tragt?','Tragt eine Uniform ihr?'],'A standard yes/no question begins with the conjugated verb.']]},
 {id:'1.3a',title:'Essen und trinken',subtitle:'Food, drinks, plurals & kein',page:28,description:'Describe meals and food preferences, learn noun plurals and use kein in the accusative.',
 lesson:{title:'Talk about what is on your plate.',intro:'Describe what you eat and drink at breakfast, lunch and dinner. Learn food nouns with both their article and plural where useful.',rule:'Kein means no or not a before a noun. Accusative forms: keinen with masculine nouns, keine with feminine and plural nouns, kein with neuter nouns.',points:['Ich esse keinen Käse, keine Birne, kein Brot and keine Eier.','German plurals vary: das Ei → die Eier, der Apfel → die Äpfel, die Kartoffel → die Kartoffeln.','Use zum Frühstück, zum Mittagessen and zum Abendessen to introduce meals.'],examples:[['Zum Frühstück esse ich ein Brötchen.','For breakfast I eat a bread roll.'],['Ich trinke keinen Kaffee.','I do not drink coffee.'],['Wir essen gern Obst und Gemüse.','We like eating fruit and vegetables.']],tip:'Do not add -s to every noun. Learn each plural with the singular.'},
 words:vocabulary('das Frühstück=breakfast|das Mittagessen=lunch|das Abendessen=dinner / evening meal|das Brot=bread|das Brötchen=bread roll|der Käse=cheese|der Schinken=ham|das Ei / die Eier=egg / eggs|der Apfel / die Äpfel=apple / apples|die Birne=pear|die Kartoffel=potato|das Obst=fruit|das Gemüse=vegetables|das Fleisch=meat|das Hähnchen=chicken|der Fisch=fish|das Wasser=water|die Milch=milk|der Tee=tea|der Kaffee=coffee|der Fruchtsaft=fruit juice|das Glas / die Gläser=glass / glasses'),
 speaking:'Describe your meals on a typical day and two things you do not eat or drink.',writing:'Keep a short food diary in German. Use three meal phrases, two plurals and two sentences with kein.',
 exercises:[['fill','Ich trinke ___ Kaffee. (no)',['keinen'],'Kaffee is masculine and the object of trinken.'],['translate','Translate: vegetables',['das Gemüse','Gemüse'],'Gemüse is used as a collective noun.'],['order','Build: For breakfast I eat bread.',['Zum','Frühstück','esse','ich','Brot'],'The meal phrase takes first position; esse stays second.'],['choice','What is the plural of das Ei?',['die Eier','die Eis','die Einen','die Eie'],'Ei has the plural Eier.'],['fill','Ich esse ___ Eier. (no)',['keine'],'Plural accusative uses keine.'],['translate','Translate: the milk',['die Milch'],'Milch is feminine.'],['order','Build: I do not eat cheese.',['Ich','esse','keinen','Käse'],'Käse is masculine: keinen Käse.'],['choice','Which is correct for no bread after essen?',['kein Brot','keinen Brot','keine Brot','keinem Brot'],'Brot is neuter, so the accusative form is kein.']]},
 {id:'1.3b',title:'Meinungen zum Essen rund um die Welt',subtitle:'Food opinions & comparatives',page:30,description:'Compare foods and eating experiences using comparative adjectives and personal opinions.',
 lesson:{title:'Make a delicious comparison.',intro:'Discuss foods you have tried or would like to try. Express your own preferences and compare tastes, dishes or meal times without treating an opinion as a rule about a country.',rule:'The comparative usually adds -er; use als for than: frischer als, billiger als. Some adjectives also change their vowel: warm → wärmer, groß → größer.',points:['Irregular comparisons include gut → besser, viel → mehr and gern → lieber.','Scharf becomes schärfer, and nah becomes näher.','Use lieber with an activity: Ich esse lieber Reis. Use besser to describe quality: Das schmeckt besser.'],examples:[['Dieses Brot ist knuspriger als das andere.','This bread is crispier than the other one.'],['Ich esse lieber Gemüse.','I prefer eating vegetables.'],['Die Suppe ist wärmer als der Salat.','The soup is warmer than the salad.']],tip:'Als is used for unequal comparisons. So … wie expresses equality: so frisch wie.'},
 words:vocabulary('das Gericht=dish / meal|die Mahlzeit=meal|der Teller=plate|die Suppe=soup|der Reis=rice|der Salat=salad|die Meeresfrüchte=seafood|der Vegetarier=male vegetarian|die Vegetarierin=female vegetarian|knusprig=crispy|köstlich=delicious|scharf=spicy / hot|frisch=fresh|warm=warm|billig=cheap|teuer=expensive|besser=better|lieber=preferably / rather|mehr=more|probieren=to try / taste'),
 speaking:'Compare two foods or dishes you know. Explain which you prefer and give reasons using at least three comparatives.',writing:'Write 80–90 words about foods you enjoy, an experience of a different cuisine and something you would like to try. Include reasons and comparisons.',
 exercises:[['fill','Diese Suppe ist ___ als die andere. (warm)',['wärmer'],'Warm takes an umlaut and -er in the comparative.'],['translate','Translate: better',['besser'],'Besser is the irregular comparative of gut.'],['order','Build: I prefer eating rice.',['Ich','esse','lieber','Reis'],'Lieber is the comparative of gern.'],['choice','Which word means than in a comparison?',['als','wie','weil','mit'],'Use als after a comparative.'],['fill','Dieses Gericht ist ___ als das andere. (scharf)',['schärfer'],'Scharf becomes schärfer.'],['translate','Translate: seafood',['die Meeresfrüchte','Meeresfrüchte'],'Meeresfrüchte is a plural noun.'],['order','Build: The bread is fresher than the cake.',['Das','Brot','ist','frischer','als','der','Kuchen'],'Frischer als means fresher than.'],['choice','What is the comparative of viel?',['mehr','vieler','meist','vielen'],'Viel has the irregular comparative mehr.']]},
 {id:'1.3c',title:'Eine ausgewogene Ernährung',subtitle:'Balanced eating & superlatives',page:32,description:'Discuss a balanced diet in German and practise superlative adjective forms.',
 lesson:{title:'From good to better to best.',intro:'Use the language of food and balanced meals to explain opinions and preferences. Superlatives let you identify what you like most or consider most important.',rule:'Use am …sten for many superlatives: frisch → am frischsten. Some adjectives need -esten, such as heiß → am heißesten. Wichtig becomes am wichtigsten.',points:['Irregular forms include gut → besser → am besten and viel → mehr → am meisten.','Some adjectives add an umlaut: groß → größer → am größten; gesund → gesünder → am gesündesten.','Before a noun, the form changes with the article: das beste Gericht, die wichtigste Mahlzeit.'],examples:[['Mir schmecken Äpfel am besten.','Apples taste best to me.'],['Wasser trinke ich am meisten.','Water is what I drink most.'],['Das ist mein liebstes Gericht.','That is my favourite dish.']],tip:'These activities practise German grammar and opinions about food; explain the reasons behind your own choices.'},
 words:vocabulary('ausgewogen=balanced|die Ernährung=diet / nutrition|die Portion=portion|das Getränk=drink|die Kohlenhydrate=carbohydrates|der Zucker=sugar|enthalten=to contain|frisch=fresh|hausgemacht=homemade|der Vorteil=advantage|der Nachtisch=dessert|zubereiten=to prepare|die Zutat=ingredient|abwechslungsreich=varied|wichtig=important|gesund=healthy|am besten=best|am meisten=most|am liebsten=most gladly / preferably|am wichtigsten=most important'),
 speaking:'Discuss foods and drinks you enjoy. Say which you like best, what you consume most often and why variety matters to you.',writing:'Create a short German poster about varied meals. Include food and drink vocabulary, reasons and three superlatives.',
 exercises:[['fill','Gut, besser, am ___.',['besten'],'Gut has the irregular superlative am besten.'],['translate','Translate: balanced',['ausgewogen'],'Ausgewogen can describe a balanced diet.'],['order','Build: I like apples best.',['Ich','esse','Äpfel','am','liebsten'],'Am liebsten is the superlative of gern.'],['choice','Which is the superlative of viel?',['am meisten','am vielsten','am mehrsten','am vielesten'],'Viel → mehr → am meisten.'],['fill','Was ist dir am ___? (wichtig)',['wichtigsten'],'Wichtig forms am wichtigsten.'],['translate','Translate: the advantage',['der Vorteil'],'Vorteil is masculine.'],['order','Build: This dish tastes best.',['Dieses','Gericht','schmeckt','am','besten'],'Am besten describes how the dish tastes.'],['choice','Choose the correct form before Gericht.',['das beste Gericht','das am besten Gericht','das besten Gericht','das besser Gericht'],'Before the noun with das, use beste.']]},
 {id:'1.4a',title:'Körperteile und Krankheit',subtitle:'Body parts & describing symptoms',page:34,description:'Name body parts, describe how you feel and use impersonal expressions with es.',
 lesson:{title:'Say how you feel.',intro:'Learn the words for parts of the body and common symptoms. These phrases help you describe a problem or explain why you cannot join an activity.',rule:'Use tut weh with a singular body part and tun weh with plural body parts: Mein Kopf tut weh. Meine Augen tun weh.',points:['Wie geht es dir? asks how you are. Reply Es geht mir gut / schlecht.','Ich habe Kopfschmerzen means I have a headache. Many pain words end in -schmerzen.','Es gibt means there is / there are. Es tut weh means it hurts.'],examples:[['Mein Hals tut weh.','My throat hurts.'],['Meine Füße tun weh.','My feet hurt.'],['Es geht mir heute nicht gut.','I do not feel well today.']],tip:'German j sounds like English y: ja begins with the sound in yes.'},
 words:vocabulary('der Kopf=head|der Hals=throat / neck|der Bauch=stomach / belly|der Rücken=back|das Auge / die Augen=eye / eyes|das Ohr / die Ohren=ear / ears|der Zahn / die Zähne=tooth / teeth|der Arm=arm|die Schulter=shoulder|die Hand=hand|der Finger=finger|das Bein=leg|der Fuß / die Füße=foot / feet|der Knöchel=ankle|die Zehe=toe|die Kopfschmerzen=headache|die Halsschmerzen=sore throat|das Fieber=fever|müde=tired|wehtun=to hurt'),
 speaking:'Role-play a call to a friend. Explain how you feel, describe two symptoms and say why you cannot meet today.',writing:'Write two short symptom descriptions. In each, name a body part, say how you feel and give a reason for cancelling a plan.',
 exercises:[['fill','Meine Augen ___ weh.',['tun'],'Augen is plural, so use tun.'],['translate','Translate: the back',['der Rücken'],'Rücken is masculine.'],['order','Build: My head hurts.',['Mein','Kopf','tut','weh'],'Kopf is singular, so use tut.'],['choice','What does Wie geht es dir? mean?',['How are you?','Where are you going?','What is your name?','What are you eating?'],'The expression asks about how someone is feeling.'],['fill','Es geht ___ nicht gut. (me)',['mir'],'The expression uses the dative mir.'],['translate','Translate: the feet',['die Füße'],'Fuß becomes Füße in the plural.'],['order','Build: I have a headache.',['Ich','habe','Kopfschmerzen'],'German uses the plural pain word Kopfschmerzen.'],['choice','Which sentence has correct agreement?',['Mein Hals tut weh.','Mein Hals tun weh.','Meine Augen tut weh.','Meine Füße tut weh.'],'Singular Hals takes tut; plural Augen and Füße take tun.']]},
 {id:'1.4b',title:'Der Körper und seine Krankheiten',subtitle:'Illness descriptions & adverbs',page:36,description:'Explain symptoms and their duration, and describe actions using adjectives as adverbs.',
 lesson:{title:'Add detail to a description.',intro:'Explain how long you have felt unwell and what you can or cannot do. Words such as langsam, gut and leise describe how an action happens.',rule:'A German adjective used as an adverb has no extra ending: Ich spreche leise. Er geht langsam. Compare English quiet → quietly; German ruhig stays ruhig.',points:['Gut, schlecht, schnell, langsam and regelmäßig can describe actions without changing form.','Seit describes a situation continuing into the present: Ich bin seit zwei Tagen krank.','Mir ist übel means I feel sick / nauseous. Ich bin krank means I am ill.'],examples:[['Ich spreche leise, weil mein Hals weh tut.','I speak quietly because my throat hurts.'],['Heute gehe ich langsam.','Today I walk slowly.'],['Ich bin seit drei Tagen krank.','I have been ill for three days.']],tip:'Focus on describing symptoms and communicating clearly. These are language exercises, not treatment instructions.'},
 words:vocabulary('krank=ill|die Krankheit=illness|die Erkältung=cold / respiratory illness|die Grippe=flu|die Schmerzen=pain|der Magen=stomach|der Nacken=back of the neck|die Brust=chest|der Arzttermin=doctor’s appointment|die Apotheke=pharmacy|das Medikament=medicine|das Schmerzmittel=painkiller|mir ist übel=I feel sick / nauseous|langsam=slowly|schnell=quickly|leise=quietly|regelmäßig=regularly|schlecht=badly / bad|seit zwei Tagen=for two days|im Bett=in bed'),
 speaking:'Explain how you feel, how long the symptoms have lasted and which everyday activities are difficult.',writing:'Write an email to a friend describing an illness. Mention symptoms, duration and things you cannot do. Include three adverbs.',
 exercises:[['fill','Ich spreche ___. (quietly)',['leise'],'An adjective used as an adverb does not gain an ending.'],['translate','Translate: the pharmacy',['die Apotheke'],'Apotheke is feminine.'],['order','Build: I have been ill for two days.',['Ich','bin','seit','zwei','Tagen','krank'],'A continuing situation with seit uses the present tense here.'],['choice','Which sentence uses an adverb correctly?',['Er geht langsam.','Er geht langsame.','Er geht langsamerer.','Er geht langsames.'],'Langsam remains unchanged when describing the action.'],['fill','___ ist übel. (I feel sick.)',['Mir'],'Mir ist übel uses the dative pronoun.'],['translate','Translate: the doctor’s appointment',['der Arzttermin'],'Arzttermin combines doctor and appointment.'],['order','Build: Today I feel bad.',['Heute','geht','es','mir','schlecht'],'Heute comes first; the conjugated verb geht remains second.'],['choice','Which word means regularly?',['regelmäßig','plötzlich','müde','krank'],'Regelmäßig means regularly.']]},
 {id:'1.4c',title:'Wie man sich fit hält',subtitle:'Sport, fitness & modal verbs',page:38,description:'Discuss sport and fitness routines using present-tense modal verbs.',
 lesson:{title:'What can you do? What do you want to do?',intro:'Describe the sports you do, your preferences and your plans. Modal verbs express ability, intention, necessity, permission or advice.',rule:'A modal verb is conjugated near the start, while the other verb stays in the infinitive at the end: Ich kann gut schwimmen. Wir wollen Tennis spielen.',points:['Können: ich kann, du kannst, er kann, wir können. Müssen: ich muss, du musst, er muss, wir müssen.','Wollen: ich will, du willst, er will, wir wollen. Dürfen: ich darf, du darfst, er darf, wir dürfen.','Sollen: ich soll; mögen: ich mag. Ich möchte … is a useful polite way to express what you would like.'],examples:[['Ich kann gut schwimmen.','I can swim well.'],['Wir wollen am Samstag Tennis spielen.','We want to play tennis on Saturday.'],['Heute muss ich zu Hause bleiben.','Today I have to stay at home.']],tip:'When you use a modal, listen for the two verb positions: kann … schwimmen.'},
 words:vocabulary('sich fit halten=to keep fit|schwimmen=to swim|radeln=to cycle|segeln=to sail|surfen=to surf|Ski laufen=to ski|Fußball spielen=to play football|Tennis spielen=to play tennis|das Federballspiel=badminton / shuttlecock game|die Leichtathletik=athletics|die Mannschaft=team|der Schläger=racket / bat|die Medaille=medal|trainieren=to train|können=can / to be able to|müssen=must / to have to|wollen=to want to|dürfen=may / to be allowed to|sollen=should / to be supposed to|mögen=to like'),
 speaking:'Describe a sport you enjoy, what you can do well and what you would like to practise. Ask a partner about their interests.',writing:'Write 80–90 words about keeping fit: your current routine, something you have done and what you want to do next. Include modal verbs.',
 exercises:[['fill','Ich ___ gut schwimmen. (can)',['kann'],'Können becomes kann with ich.'],['translate','Translate: the team',['die Mannschaft'],'Mannschaft is feminine.'],['order','Build: We want to play tennis.',['Wir','wollen','Tennis','spielen'],'The infinitive spielen goes at the end after wollen.'],['choice','Which sentence has the correct verb order?',['Ich muss heute trainieren.','Ich muss trainiere heute.','Ich trainieren muss heute.','Ich heute muss trainieren.'],'The modal is conjugated; the infinitive is last.'],['fill','Du ___ hier spielen. (may)',['darfst'],'Dürfen becomes darfst with du.'],['translate','Translate: to cycle',['radeln','Rad fahren','Fahrrad fahren'],'Radeln and Rad fahren both describe cycling.'],['order','Build: Today I have to stay at home.',['Heute','muss','ich','zu','Hause','bleiben'],'Muss stays second even when Heute begins the sentence.'],['choice','Which form completes Er ___ Fußball spielen? (wants to)',['will','wollt','wollen','willst'],'Wollen becomes will with er.']]},
 {id:'1.4d',title:'Gesund leben',subtitle:'Lifestyle & separable verbs',page:40,description:'Discuss daily habits, food, sport and relaxation using separable verbs.',
 lesson:{title:'Bring your routine together.',intro:'Describe how food, activity and relaxation fit into your day. Separable verbs are useful for actions such as preparing meals, going out, joining in and resting.',rule:'In a present-tense main clause, a separable verb splits: fernsehen → Ich sehe am Abend fern. The conjugated verb is second and its prefix goes to the end.',points:['Examples: aufmachen → macht … auf; zubereiten → bereitet … zu; ausprobieren → probiert … aus.','With a modal, keep the infinitive together at the end: Ich will mitmachen.','Sich ausruhen also needs a reflexive pronoun: Ich ruhe mich aus. Wir ruhen uns aus.'],examples:[['Wir bereiten das Abendessen zu.','We prepare dinner.'],['Nach der Schule ruhe ich mich aus.','After school I rest.'],['Ich möchte eine neue Sportart ausprobieren.','I would like to try a new sport.']],tip:'When learning a separable verb, mark its prefix and practise both its main-clause and modal-verb patterns.'},

const localDay=(date=new Date())=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
function shiftDay(day,amount){const [y,m,d]=day.split('-').map(Number);return localDay(new Date(y,m-1,d+amount,12));}
function initialState(){return {version:1,profile:{name:'',goal:50,theme:'light'},xp:0,daily:{},rewards:{},reviews:{},lessons:[],sessions:[],plans:[],customCards:[],quizBest:{},focusMinutes:0,badges:[],drafts:{}};}
function normalize(value){return String(value).normalize('NFC').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[.,!?;:…]/g,'').replace(/\s+/g,' ').trim();}
function answerMatches(value,answers){return answers.some(a=>normalize(a)===normalize(value));}
function levelInfo(xp){const level=Math.floor(Math.max(0,xp)/250)+1;return {level,current:xp%250,needed:250,percent:Math.round((xp%250)/250*100)};}
function streak(state,today=localDay()){let day=state.daily[today]?.actions?today:shiftDay(today,-1);let count=0;while(state.daily[day]?.actions){count++;day=shiftDay(day,-1);}return count;}
function bestStreak(state){let best=0,current=0,previous=null;for(const day of Object.keys(state.daily).filter(d=>state.daily[d].actions>0).sort()){current=previous&&shiftDay(previous,1)===day?current+1:1;best=Math.max(best,current);previous=day;}return best;}
function award(state,key,amount,day=localDay()){if(state.rewards[key])return 0;state.rewards[key]=true;state.xp+=amount;state.daily[day]??={xp:0,actions:0};state.daily[day].xp+=amount;state.daily[day].actions++;return amount;}
function reviewCard(state,id,grade,day=localDay()){if(!['again','hard','good'].includes(grade))throw Error('Invalid grade');const prev=state.reviews[id]||{interval:0,repetitions:0};const interval=grade==='again'?0:grade==='hard'?1:Math.min(60,Math.max(2,prev.interval*2||2));state.reviews[id]={interval,repetitions:prev.repetitions+1,due:shiftDay(day,interval),last:day,difficult:grade!=='good',mastered:grade==='good'&&prev.repetitions>=1};return award(state,`card:${id}:${day}`,grade==='good'?10:5,day);}
function completeLesson(state,id,day=localDay()){if(!state.lessons.includes(id))state.lessons.push(id);return award(state,`lesson:${id}`,20,day);}
function completeQuiz(state,unit,correct,total,day=localDay()){if(!Number.isInteger(total)||total<1||correct<0||correct>total)throw Error('Invalid quiz result');const score=Math.round(correct/total*100);state.quizBest[unit]=Math.max(state.quizBest[unit]||0,score);state.daily[day]??={xp:0,actions:0};state.daily[day].actions++;return score;}
function unitProgress(state,unit,allCards){const deck=allCards.filter(c=>c.unit===unit);const learned=deck.filter(c=>state.reviews[c.id]?.mastered).length;return Math.round((state.lessons.includes(unit)?20:0)+(deck.length?learned/deck.length*50:0)+(state.quizBest[unit]||0)*.3);}
function shuffle(items,random=Math.random){const arr=[...items];for(let i=arr.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
const isObject=x=>x&&typeof x==='object'&&!Array.isArray(x);
const safeKey=k=>!['__proto__','constructor','prototype'].includes(k);
const int=(v,min,max)=>Number.isInteger(v)&&v>=min&&v<=max;
function validateState(raw){
 if(!isObject(raw)||raw.version!==1)throw Error('This is not a compatible Lernraum backup.');
 const s=initialState();
 if(!isObject(raw.profile)||typeof raw.profile.name!=='string'||raw.profile.name.length>50||![25,50,100,150].includes(raw.profile.goal)||!['light','dark'].includes(raw.profile.theme))throw Error('Invalid profile.');
 s.profile={name:raw.profile.name,goal:raw.profile.goal,theme:raw.profile.theme};
 if(!int(raw.xp,0,10000000))throw Error('Invalid XP.');s.xp=raw.xp;
 for(const key of ['daily','rewards','reviews','quizBest'])if(!isObject(raw[key])||Object.keys(raw[key]).length>100000)throw Error('Invalid progress data.');
 const dayPattern=/^\d{4}-\d{2}-\d{2}$/;
 for(const [k,v]of Object.entries(raw.daily)){if(!dayPattern.test(k)||!isObject(v)||!int(v.xp,0,100000)||!int(v.actions,0,100000))throw Error('Invalid daily activity.');s.daily[k]={xp:v.xp,actions:v.actions};}
 for(const [k,v]of Object.entries(raw.rewards)){if(safeKey(k)&&k.length<200&&v===true)s.rewards[k]=true;}
 for(const [k,v]of Object.entries(raw.reviews)){if(!safeKey(k)||!isObject(v)||!int(v.interval,0,60)||!int(v.repetitions,0,100000)||!dayPattern.test(v.due)||!dayPattern.test(v.last))throw Error('Invalid card progress.');s.reviews[k]={interval:v.interval,repetitions:v.repetitions,due:v.due,last:v.last,difficult:!!v.difficult,mastered:!!v.mastered};}
 for(const [k,v]of Object.entries(raw.quizBest)){if(!safeKey(k)||!int(v,0,100))throw Error('Invalid score.');s.quizBest[k]=v;}
 for(const key of ['lessons','plans','sessions','customCards'])if(!Array.isArray(raw[key])||raw[key].length>10000)throw Error('Invalid saved items.');
 s.lessons=[...new Set(raw.lessons.filter(x=>typeof x==='string'&&x.length<100))];
 s.plans=raw.plans.map(p=>{if(!isObject(p)||typeof p.id!=='string'||p.id.length>100||typeof p.title!=='string'||p.title.length>120||!dayPattern.test(p.date)||!int(p.minutes,5,180)||typeof p.unit!=='string'||p.unit.length>100)throw Error('Invalid planner session.');return {id:p.id,title:p.title,date:p.date,minutes:p.minutes,unit:p.unit,done:!!p.done};});
 s.customCards=raw.customCards.map(c=>{if(!isObject(c)||!['id','unit','front','back'].every(k=>typeof c[k]==='string'&&c[k].length>0&&c[k].length<=300))throw Error('Invalid custom card.');return {id:c.id,unit:c.unit,front:c.front,back:c.back};});
 s.sessions=raw.sessions.map(x=>{if(!isObject(x)||!['review','quiz','lesson','focus','writing'].includes(x.type)||typeof x.title!=='string'||x.title.length>150||!Number.isFinite(Date.parse(x.date))||!int(x.xp,0,100000))throw Error('Invalid activity history.');const v={type:x.type,title:x.title,date:x.date,xp:x.xp};if(int(x.score,0,100))v.score=x.score;return v;});
 s.focusMinutes=int(raw.focusMinutes,0,1000000)?raw.focusMinutes:0;
 s.badges=Array.isArray(raw.badges)?raw.badges.filter(x=>typeof x==='string'&&x.length<50).slice(0,250):[];
 if(raw.drafts!==undefined){if(!isObject(raw.drafts)||Object.keys(raw.drafts).length>1000)throw Error('Invalid writing drafts.');for(const [key,value] of Object.entries(raw.drafts)){if(!safeKey(key)||key.length>100||typeof value!=='string'||value.length>10000)throw Error('Invalid writing draft.');s.drafts[key]=value;}}
 return s;
}
function loadState(storage){try{const raw=storage.getItem(STORAGE_KEY);return {state:raw?validateState(JSON.parse(raw)):initialState(),error:false};}catch{return {state:initialState(),error:true};}}
function saveState(storage,state){try{storage.setItem(STORAGE_KEY,JSON.stringify(state));return true;}catch{return false;}}

function flashcards(){if(session)return renderReview();return `${pageIntro('Make every word stick.','Flip, recall, repeat. A little practice makes it familiar.',`<button class="btn secondary" data-action="add-card">${icon('plus')} Add a card</button>`)}${sourceNotice()}<div class="center-stage"><div class="panel study-setup"><div><div class="setup-icon sage">${icon('cards')}</div><h2>Your next word is waiting.</h2><p>Read the German, recall the meaning, then turn the card. Your confidence decides when it comes back.</p><div class="setup-stats"><div><strong>${dueCards().length}</strong><small>ready to review</small></div><div><strong>${mastered()}</strong><small>words mastered</small></div><div><strong>${allCards().length}</strong><small>in your collection</small></div></div><div class="setup-fields"><div class="field"><label for="review-unit">Choose your unit</label><select id="review-unit">${unitOptions(reviewUnit)}</select></div><div class="field"><label for="review-mode">What would you like to review?</label><select id="review-mode"><option value="due" ${reviewMode==='due'?'selected':''}>Due & new cards</option><option value="all" ${reviewMode==='all'?'selected':''}>All cards</option><option value="difficult" ${reviewMode==='difficult'?'selected':''}>Difficult cards</option></select></div><div class="field"><label for="review-size">Cards per session</label><select id="review-size"><option value="10" ${reviewSize==='10'?'selected':''}>10 cards</option><option value="20" ${reviewSize==='20'?'selected':''}>20 cards</option><option value="all" ${reviewSize==='all'?'selected':''}>Entire deck</option></select></div><button class="btn full" data-action="start-review">${icon('play')} Start review</button><p id="review-summary" class="small muted" style="margin:0">${e(reviewSummary())}</p></div></div><p class="hint">${icon('info')} “Got it” schedules a review in 2 days, then doubles the interval up to 60 days. “Still learning” returns tomorrow. “Again” stays due today. Mastery starts after two reviews with the latest marked “Got it.”</p>${state.customCards.length?`<div class="panel"><h2>Your own cards</h2>${state.customCards.map(c=>`<div class="activity"><div><strong>${e(c.front)}</strong><small>${e(c.back)}</small></div><span><button class="icon-btn" data-action="delete-card" data-id="${e(c.id)}" aria-label="Delete ${e(c.front)}">${icon('trash')}</button></span></div>`).join('')}</div>`:''}</div>`;}
function renderReview(){if(session.finished)return resultHTML('Review complete.','Every time you recall a word, you make it a little more yours.',session.xp,`${session.items.length} cards`,`${session.known} confident`,'review-again');const c=session.items[session.index],u=unitById(c.unit);return `${pageIntro('A little word practice.','Take your time. Remembering takes repetition.')}<div class="center-stage"><div class="session-top"><strong>${e(u?u.id+' · '+u.title:'Your cards')} · ${session.index+1} of ${session.items.length}</strong><button class="text-btn" data-action="exit-review">End session</button></div><div class="progress"><span style="width:${session.index/session.items.length*100}%"></span></div><button class="flashcard ${session.flipped?'flipped':''}" data-action="flip" aria-label="${session.flipped?'Show German':'Reveal meaning'}"><span class="eyebrow">${session.flipped?'ENGLISH MEANING':'GERMAN · RECALL THE MEANING'}</span><span class="word" lang="${session.flipped?'en':'de'}">${e(session.flipped?c.back:c.front)}</span>${session.flipped?`<span class="translation" lang="de">${e(c.front)}</span>`:''}<span class="flip-hint">${icon('flip')} ${session.flipped?'Click to see German':'Click to reveal'}</span></button><div class="card-actions"><button class="icon-btn" data-action="speak" data-text="${e(c.front)}" aria-label="Listen to German">${icon('sound')}</button><button class="btn secondary sm" data-action="flag-card" aria-pressed="${!!state.reviews[c.id]?.difficult}">${icon('flag')} ${state.reviews[c.id]?.difficult?'Marked difficult':'Mark difficult'}</button></div><div class="review-grades ${session.flipped?'':'invisible'}" ${session.flipped?'':'inert'}><button class="grade again" data-action="grade" data-grade="again">Again<small>Keep practising · 1</small></button><button class="grade hard" data-action="grade" data-grade="hard">Still learning<small>Review tomorrow · 2</small></button><button class="grade good" data-action="grade" data-grade="good">Got it<small>Review later · 3</small></button></div><p class="session-hint">Space to flip · 1, 2 or 3 to rate after revealing · XP is awarded once per card each day.</p></div>`;}
function resultHTML(title,description,xp,one,two,action){return `<div class="center-stage"><div class="panel result"><div class="setup-icon sage">${icon('trophy')}</div><span class="eyebrow muted">ANOTHER SMALL STEP FORWARD</span><h2 style="margin-top:12px">${title}</h2><p>${description}</p><div class="result-stats"><div><strong>+${xp}</strong><span>XP earned</span></div><div><strong>${e(one.split(' ')[0])}</strong><span>${e(one.split(' ').slice(1).join(' '))}</span></div><div><strong>${e(two.split(' ')[0])}</strong><span>${e(two.split(' ').slice(1).join(' '))}</span></div></div><div class="card-actions"><button class="btn" data-action="${action}">Keep practising</button><a href="#dashboard" class="btn secondary">Back to overview</a></div>${quiz?.finished&&quiz.mistakes.length?'<button class="text-btn" data-action="retry-mistakes">Practise missed questions</button>':''}</div></div>`;}
function startReview(){let items=allCards().filter(c=>(reviewUnit==='all'||c.unit===reviewUnit)&&(reviewMode==='all'||(reviewMode==='difficult'?state.reviews[c.id]?.difficult:!state.reviews[c.id]||state.reviews[c.id].due<=localDay())));if(!items.length){toast(reviewMode==='difficult'?'No difficult cards yet. Mark a card during a review.':'You’re all caught up! Choose All cards to keep practising.');return;}session={items:shuffle(items).slice(0,reviewSize==='all'?items.length:Number(reviewSize)),index:0,flipped:false,xp:0,known:0,finished:false};render();}

function practice(){if(quiz)return renderQuiz();return `${pageIntro('Turn knowledge into confidence.','A safe space to try, make mistakes, and try again.')}${sourceNotice()}<div class="center-stage"><div class="panel study-setup"><div><div class="setup-icon lavender">${icon('pen')}</div><h2>Put your German to work.</h2><p>Mix quick questions with translations, missing words and sentence building. Get an explanation after every answer.</p><span class="pill">Up to 8 questions · about 5 minutes</span></div><div class="setup-fields"><div class="field"><label for="practice-unit">Choose your unit</label><select id="practice-unit">${unitOptions(practiceUnit)}</select></div><div class="field"><label for="practice-mode">Exercise type</label><select id="practice-mode">${[['mixed','A little of everything'],['choice','Multiple choice'],['fill','Fill in the blank'],['translate','Translation'],['order','Sentence builder']].map(([v,t])=>`<option value="${v}" ${practiceMode===v?'selected':''}>${t}</option>`).join('')}</select></div><button class="btn full" data-action="start-quiz">${icon('play')} Start practice</button></div></div><div class="quiz-modes">${[['target','Quick choices','Find the right meaning'],['pen','Fill the gap','Make the phrase fit'],['book','Translation','Recall it yourself'],['cards','Build a sentence','Put words in their place']].map(([i,t,d])=>`<div class="mode-card">${icon(i)}<strong>${t}</strong><p>${d}</p></div>`).join('')}</div><p class="hint">Correct answers earn 15 XP once per question each day. Mixed practice also draws vocabulary questions from your selected unit. Mistakes are useful: review them at the end.</p></div>`;}
const typeLabels={choice:'Multiple choice',fill:'Fill in the blank',translate:'Translation',order:'Sentence builder'};
function buildQuestions(){let pool=exercises.filter(q=>practiceUnit==='all'||q.unit===practiceUnit);const vocab=allCards().filter(c=>practiceUnit==='all'||c.unit===practiceUnit).map(c=>({id:'vocab-'+c.id,unit:c.unit,type:'choice',prompt:`What does “${c.front}” mean?`,answers:[c.back,...shuffle([...new Set(allCards().map(x=>x.back))].filter(x=>x!==c.back)).slice(0,3)],explanation:`${c.front} means ${c.back}.`}));if(practiceMode==='mixed'){const authored=shuffle(pool).slice(0,6);pool=[...authored,...shuffle(vocab).slice(0,Math.max(2,8-authored.length))];}else if(practiceMode==='choice')pool=[...pool.filter(q=>q.type==='choice'),...vocab];else pool=pool.filter(q=>q.type===practiceMode);return shuffle(pool).slice(0,8);}
function startQuiz(items=null){const list=items||buildQuestions();if(!list.length){toast('No questions are available for this selection.');return;}quiz={items:list,index:0,correct:0,xp:0,answer:'',checked:false,finished:false,mistakes:[],selectedWords:[],unit:practiceUnit};prepareQuestion();render();}
function prepareQuestion(){quiz.answer='';quiz.checked=false;quiz.selectedWords=[];const q=quiz.items[quiz.index];quiz.options=q.type==='choice'?shuffle(q.answers):[];quiz.bank=q.type==='order'?shuffle(q.answers.map((word,i)=>({word,id:i}))):[];}
function renderQuiz(){if(quiz.finished)return resultHTML('Look how far you’ve come.',quiz.correct===quiz.items.length?'A perfect practice session. Your hard work is taking root.':'Keep the useful mistakes. They show you what to practise next.',quiz.xp,`${Math.round(quiz.correct/quiz.items.length*100)}% accuracy`,`${quiz.correct}/${quiz.items.length} correct`,'quiz-again');const q=quiz.items[quiz.index],expected=q.type==='order'?q.answers.join(' '):q.answers[0];let input='';if(q.type==='choice')input=`<div class="options">${quiz.options.map((v,i)=>`<button class="option ${quiz.answer===v?'selected':''} ${quiz.checked&&v===q.answers[0]?'correct':''} ${quiz.checked&&quiz.answer===v&&!quiz.isCorrect?'incorrect':''}" data-action="choose" data-index="${i}" ${quiz.checked?'disabled':''}><span>${String.fromCharCode(65+i)}</span>${e(v)}</button>`).join('')}</div>`;else if(q.type==='order')input=`<div class="word-answer" aria-label="Your sentence">${quiz.selectedWords.length?quiz.selectedWords.map((id,i)=>`<button class="word-chip" data-action="remove-word" data-index="${i}" ${quiz.checked?'disabled':''}>${e(q.answers[id])}</button>`).join(''):'<span class="muted small">Tap the words below to build your sentence.</span>'}</div><div class="word-bank" aria-label="Available words">${quiz.bank.map(w=>`<button class="word-chip ${quiz.selectedWords.includes(w.id)?'used':''}" data-action="add-word" data-index="${w.id}" ${quiz.checked||quiz.selectedWords.includes(w.id)?'disabled':''}>${e(w.word)}</button>`).join('')}</div>`;else input=`<label class="sr-only" for="quiz-answer">Your answer</label><input id="quiz-answer" class="answer-input" autocomplete="off" spellcheck="false" lang="de" placeholder="Type your answer in German…" value="${e(quiz.answer)}" ${quiz.checked?'disabled':''}><div class="umlaut-row" aria-label="German characters">${['ä','ö','ü','ß','Ä','Ö','Ü'].map(x=>`<button data-action="insert-char" data-char="${x}" ${quiz.checked?'disabled':''}>${x}</button>`).join('')}</div>`;return `${pageIntro('A little practice goes a long way.','One question at a time. You’ve got this.')}<div class="center-stage"><div class="session-top"><strong>${e(q.unit)} · Question ${quiz.index+1} of ${quiz.items.length}</strong><button class="text-btn" data-action="exit-quiz">End practice</button></div><div class="progress"><span style="width:${quiz.index/quiz.items.length*100}%"></span></div><section class="panel question-card"><span class="pill">${typeLabels[q.type]}</span><h2>${e(q.prompt)}</h2>${input}${quiz.checked?`<div class="feedback ${quiz.isCorrect?'correct':'incorrect'}" role="status"><strong>${icon(quiz.isCorrect?'check':'info')} ${quiz.isCorrect?'That’s right!':'A good one to remember.'}</strong>${!quiz.isCorrect?`<p>Answer: <b lang="de">${e(expected)}</b></p>`:''}<p>${e(q.explanation)}</p></div>`:''}<div class="question-footer"><small>${quiz.checked?(quiz.isCorrect?'Another connection made.':'Mistakes are part of learning.'):'Take your time. There’s no rush.'}</small><button class="btn" data-action="${quiz.checked?'next-question':'check-answer'}" ${!quiz.checked&&!quiz.answer.trim()?'disabled':''}>${quiz.checked?(quiz.index===quiz.items.length-1?'See results':'Next question'):'Check answer'}</button></div></section></div>`;}
function checkAnswer(){if(!quiz||quiz.checked||!quiz.answer.trim())return;const q=quiz.items[quiz.index];quiz.isCorrect=q.type==='choice'?quiz.answer===q.answers[0]:q.type==='order'?answerMatches(quiz.answer,[q.answers.join(' ')]):answerMatches(quiz.answer,q.answers);quiz.checked=true;const before=state.xp;if(quiz.isCorrect){quiz.correct++;const earned=award(state,`question:${q.id}:${localDay()}`,15);quiz.xp+=earned;rewardNotice(earned,before);}else quiz.mistakes.push(q);save();render();}
function nextQuestion(){if(!quiz?.checked)return;quiz.index++;if(quiz.index>=quiz.items.length){quiz.finished=true;const score=completeQuiz(state,quiz.unit,quiz.correct,quiz.items.length);for(const u of new Set(quiz.items.map(q=>q.unit))){const qs=quiz.items.filter(q=>q.unit===u),missed=quiz.mistakes.filter(q=>q.unit===u).length;completeQuiz(state,u,qs.length-missed,qs.length);}addSession('quiz',`${quiz.items.length} practice questions`,quiz.xp,{score});save();}else prepareQuestion();render();}
function weekDays(offset=0){const today=localDay(),dow=new Date(today+'T12:00:00').getDay();const monday=shiftDay(today,-((dow+6)%7)+offset*7);return Array.from({length:7},(_,i)=>shiftDay(monday,i));}
function timerHTML(){return `<div class="timer"><div class="panel-heading"><h2>A moment to focus</h2>${icon('clock')}</div><div class="timer-display" data-timer-display>25:00</div><p data-timer-status>One thing at a time.</p><div class="timer-controls"><button class="btn" data-action="timer-toggle" data-timer-toggle>${icon('play')} Start focus</button><button class="icon-btn" data-action="timer-reset" aria-label="Reset timer">${icon('reset')}</button></div><div class="timer-presets">${[5,15,25,45].map(m=>`<button data-action="timer-preset" data-minutes="${m}" class="${timer.duration===m?'active':''}">${m} min</button>`).join('')}</div><p class="small" style="margin-top:19px;font-size:.73rem">Keep this tab open. Completed focus time earns XP once per day.</p></div>`;}
function planner(){const days=weekDays(weekOffset),plans=state.plans.filter(p=>p.date===selectedDate);return `${pageIntro('Make a little room for learning.','A realistic plan beats a perfect one. Start small.',`<button class="btn" data-action="add-plan">${icon('plus')} Plan a session</button>`)}<div class="planner-layout"><section><div class="week-nav"><strong>${fmtDate(days[0])} – ${fmtDate(days[6],{day:'numeric',month:'short',year:'numeric'})}</strong><button class="icon-btn" data-action="prev-week" aria-label="Previous week">${icon('left')}</button><button class="btn secondary sm" data-action="today">Today</button><button class="icon-btn" data-action="next-week" aria-label="Next week">${icon('chevron')}</button></div><div class="week-grid">${days.map(day=>`<button class="calendar-day ${day===selectedDate?'selected':''} ${day===localDay()?'today':''}" data-action="select-date" data-date="${day}" aria-pressed="${day===selectedDate}" aria-label="${fmtDate(day,{weekday:'long',day:'numeric',month:'long'})}"><span>${fmtDate(day,{weekday:'short'})}</span><strong>${fmtDate(day,{day:'numeric'})}</strong>${state.plans.some(p=>p.date===day)?'<em></em>':'<em style="visibility:hidden"></em>'}</button>`).join('')}</div><div class="section-head"><h2>${selectedDate===localDay()?'Today':fmtDate(selectedDate,{weekday:'long',day:'numeric',month:'long'})}</h2><span class="muted small">${plans.filter(p=>p.done).length}/${plans.length} complete</span></div>${plans.length?plans.map(p=>`<div class="plan-row"><button class="check-btn ${p.done?'checked':''}" data-action="toggle-plan" data-id="${e(p.id)}" aria-label="${p.done?'Mark incomplete':'Complete'}: ${e(p.title)}" aria-pressed="${p.done}">${p.done?icon('check'):''}</button><div class="plan-info ${p.done?'completed-text':''}"><strong>${e(p.title)}</strong><p>${p.minutes} min · ${e(unitById(p.unit)?.title||'General study')}</p></div><div class="row-actions"><button class="icon-btn" data-action="edit-plan" data-id="${e(p.id)}" aria-label="Edit session">${icon('pen')}</button><button class="icon-btn" data-action="delete-plan" data-id="${e(p.id)}" aria-label="Delete session">${icon('trash')}</button></div></div>`).join(''):`<div class="empty-state">${icon('calendar')}<h3>A little space in your day.</h3><p>No sessions planned. Add one small, achievable goal.</p><button class="btn secondary" data-action="add-plan">${icon('plus')} Add a session</button></div>`}<p class="hint">Your planner is a personal checklist. Earn XP and build your streak by studying, reviewing cards or completing a focus timer.</p></section><aside class="side-column"><section class="panel">${timerHTML()}</section></aside></div>`;}

function notebook(){
 return pageIntro('Writing notebook','Choose a task, open your notebook and write in German.')+chapters.map(ch=>{
  const tasks=units.filter(u=>u.chapter===ch.id);
  return `<section class="panel notebook-section"><div class="panel-heading"><h2>${ch.title}</h2><span class="pill">${tasks.filter(u=>state.rewards['writing:'+u.id]).length} / ${tasks.length} finished</span></div>${tasks.map(u=>`<button class="notebook-row" data-action="writing-guide" data-id="${u.id}"><span class="unit-icon ${ch.color}">${icon(state.rewards['writing:'+u.id]?'check':'pen')}</span><span><strong lang="de">${e(u.title)}</strong><small>${u.id} · ${notebookGuides[u.id][0]}${state.rewards['writing:'+u.id]?' · Finished':''}</small></span></button>`).join('')}</section>`;
 }).join('');
}
function openWriting(id){
 const u=unitById(id);if(!u)return;

}
function rankPanel(){
 const lv=levelInfo(state.xp).level,next=ranks.find(([n])=>n>lv);
 return `<section class="panel rank-panel"><span class="unit-icon butter">${icon('star')}</span><div><h2>Level ${lv} · ${ranks.filter(([n])=>lv>=n).at(-1)[1]}</h2><p>${next?`${((next[0]-1)*250-state.xp).toLocaleString()} XP to ${next[1]} at level ${next[0]}.`:'Highest named rank earned. Every 250 XP adds another level.'}</p><details><summary>Explore the ranks</summary><ul>${ranks.map(([n,name])=>`<li>Level ${n} · ${name}${lv>=n?' ✓':''}</li>`).join('')}</ul></details></div></section>`;
}

function progress(){const days=Array.from({length:7},(_,i)=>shiftDay(localDay(),i-6)),max=Math.max(50,...days.map(d=>state.daily[d]?.xp||0)),badges=courseAchievements();return `${pageIntro('Look at you, growing.','Every small step leaves a little progress behind.')}<div class="stat-grid">${stat(state.xp.toLocaleString(),'Lifetime XP','bolt','sage')}${stat(levelInfo(state.xp).level,'Your level','sprout','butter')}${stat(state.sessions.filter(s=>s.type==='quiz').length,'Practice sessions','pen','lavender')}${stat(state.focusMinutes,'Focused minutes','clock','sky')}</div><div class="progress-layout"><section class="panel"><div class="panel-heading"><h2>Your week in XP</h2><span class="pill">${days.reduce((a,d)=>a+(state.daily[d]?.xp||0),0)} XP</span></div><p class="small">Progress comes from showing up.</p><div class="chart" role="img" aria-label="XP earned in the last seven days">${days.map(day=>{const xp=state.daily[day]?.xp||0;return `<div class="chart-col" title="${day}: ${xp} XP"><span class="chart-value">${xp}</span><div class="chart-bar-wrap"><div class="chart-bar" style="height:${xp/max*100}%"></div></div><small>${fmtDate(day,{weekday:'short'})}</small></div>`;}).join('')}</div></section><section class="panel"><div class="panel-heading"><h2>A habit taking root</h2><span class="pill">${streak(state)} day streak</span></div><p class="small">Your last 28 days of learning.</p><div class="heatmap">${Array.from({length:28},(_,i)=>{const day=shiftDay(localDay(),i-27),xp=state.daily[day]?.xp||0;return `<div class="heatcell ${xp>=state.profile.goal?'high':xp>0?'low':''}" title="${day}: ${xp} XP" aria-label="${day}: ${xp} XP"></div>`;}).join('')}</div><div class="heatmap-caption"><span>${fmtDate(shiftDay(localDay(),-27))}</span><span>Today</span></div></section></div>${rankPanel()}<div class="section-head"><h2>Little milestones, well earned.</h2><span class="muted small">${badges.filter(b=>b.unlocked).length} of ${badges.length} unlocked</span></div>${[...new Set(badges.map(b=>b.group))].map(group=>{const groupBadges=badges.filter(b=>b.group===group);return `<details class="panel badge-group" ${group==='Foundations'?'open':''}><summary>${group} · ${groupBadges.filter(b=>b.unlocked).length}/${groupBadges.length}</summary><div class="achievement-grid">${groupBadges.map(b=>`<div class="achievement ${b.unlocked?'unlocked':''}"><div class="medal">${icon(b.icon)}</div><h3>${b.title}</h3><p>${b.description}</p><span class="pill" style="${b.unlocked?'':'background:var(--bg);color:var(--muted)'}">${icon(b.unlocked?'check':'lock')} ${b.unlocked?'Unlocked':b.target?`${Math.min(b.value,b.target)} / ${b.target}`:'In progress'}</span></div>`).join('')}</div></details>`;}).join('')}<div class="progress-layout"><section class="panel"><div class="panel-heading"><h2>Unit progress</h2></div><div class="mastery-list">${units.map(u=>{const pct=unitProgress(state,u.id,allCards());return `<div class="mastery-row"><div class="unit-icon ${u.color}">${icon(u.icon)}</div><div><strong>${u.id} · ${e(u.title)}</strong><div class="progress"><span style="width:${pct}%"></span></div></div><span>${pct}%</span></div>`;}).join('')}</div><p class="hint" style="padding-bottom:0">20% lesson completion · 50% word mastery · 30% best practice score.</p></section><section class="panel"><div class="panel-heading"><h2>Recently in your space</h2></div>${state.sessions.length?state.sessions.slice(0,7).map(s=>`<div class="activity">${icon({review:'cards',quiz:'pen',lesson:'book',focus:'clock',writing:'pen'}[s.type])}<div><strong>${e(s.title)}</strong><small>${new Date(s.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}${s.score!==undefined?` · ${s.score}% accuracy`:''}</small></div><span>+${s.xp} XP</span></div>`).join(''):'<div class="empty-small">Your story starts with one small step.<br>Complete a lesson or try a few cards.</div>'}</section></div>`;}

er and personal cards.</p><button class="btn danger sm" data-action="reset-data">Reset all data</button></div></section><section class="panel"><h2>About your study material</h2><p>${e(source.title)}</p><div class="source-detail"><b>Lessons through 1.4d · Full vocabulary from book pages 42–45.</b><br>${e(source.note)}<br><br>Each section has vocabulary, grammar notes, speaking and writing prompts, and four kinds of interactive practice. Page references use the printed book numbering; PDF page numbers are shown inside lessons.</div></section><section class="panel"><h2>Little shortcuts</h2><div class="activity"><div><strong>Search your space</strong><small>Ctrl / ⌘ + K</small></div></div><div class="activity"><div><strong>Flip a flashcard</strong><small>Space</small></div></div><div class="activity"><div><strong>Rate a revealed card</strong><small>1 · Again, 2 · Still learning, 3 · Got it</small></div></div><div class="activity"><div><strong>Check a typed answer</strong><small>Enter</small></div></div><p class="hint">Pronunciation uses your browser’s German voice when available. AE / OE / UE and SS are accepted as alternatives to German special characters in typed answers.</p></section></div>`;}

function modal(title,body,onMount){lastFocus=document.activeElement;$('#modal-root').innerHTML=`<dialog aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${body}</div></dialog>`;const d=$('dialog');d.addEventListener('close',()=>{lastFocus?.focus?.();});d.addEventListener('click',ev=>{if(ev.target===d){const r=d.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)d.close();}});d.showModal();onMount?.();}
function closeModal(){$('dialog')?.close();}
function openLesson(id){const u=unitById(id);if(!u)return;modal(e(u.id+' · '+u.title),`<div class="lesson-body"><div class="lesson-title"><div class="unit-icon ${u.color}">${icon(u.icon)}</div><div><strong>${e(u.subtitle)}</strong><p class="small">Book pp. ${u.pages.join('–')} · PDF pp. ${u.pdfPages.join('–')} · about ${u.minutes} min</p></div></div><h3>${e(u.lesson.title)}</h3><p>${e(u.lesson.intro)}</p><div class="lesson-rule">${e(u.lesson.rule)}</div><ul class="lesson-points">${u.lesson.points.map(point=>`<li>${e(point)}</li>`).join('')}</ul>${u.lesson.examples.map(([de,en])=>`<div class="example"><div><strong lang="de">${e(de)}</strong><p>${e(en)}</p></div><button class="icon-btn" data-action="speak" data-text="${e(de)}" aria-label="Listen to ${e(de)}">${icon('sound')}</button></div>`).join('')}<div class="lesson-tip">${e(u.lesson.tip)}</div><h3>Your words to keep</h3><p class="small">${u.words.length} cards · Full vocabulary list from book p. ${u.vocabularyPage}, plus your original revision words.</p><table class="vocab-table"><thead><tr><th>German</th><th>English</th></tr></thead><tbody>${u.words.map(([de,en])=>`<tr><td lang="de">${e(de)}</td><td>${e(en)}</td></tr>`).join('')}</tbody></table><section class="productive-task"><h3>Say it aloud</h3><p>${e(u.speaking)}</p><h3>Writing practice</h3><button class="btn secondary" data-action="writing-guide" data-id="${u.id}">Open notebook guide</button><p>${e(u.writing)}</p><div class="field"><label for="writing-draft">Your writing draft</label><textarea id="writing-draft" lang="de" rows="6" maxlength="10000" placeholder="Write your response in German…">${e(state.drafts[u.id]||'')}</textarea><small id="draft-status" role="status">Saved in this browser as you type. Use the examples to check your work; free writing is not automatically graded.</small></div></section><div class="modal-actions"><button class="btn secondary" data-action="lesson-cards" data-id="${u.id}">Review cards</button><button class="btn secondary" data-action="lesson-practice" data-id="${u.id}">Practise this section</button><button class="btn" data-action="complete-lesson" data-id="${u.id}">${icon('check')} ${state.lessons.includes(u.id)?'Completed':'Complete lesson · 20 XP'}</button></div></div>`,()=>$('#writing-draft').addEventListener('input',ev=>{state.drafts[u.id]=ev.target.value;save();$('#draft-status').textContent=storageError?'Could not save. Copy your writing before closing.':'Draft saved in this browser · '+ev.target.value.trim().split(/\s+/).filter(Boolean).length+' words';}));}
function planDialog(id=null){const p=state.plans.find(p=>p.id===id);modal(p?'Edit your session':'Make time for learning',`<form id="plan-form" class="form-stack"><div class="field"><label for="plan-title">What would you like to study?</label><input id="plan-title" name="title" required maxlength="120" placeholder="e.g. Review family vocabulary" value="${e(p?.title||'')}"></div><div class="field"><label for="plan-unit">Unit</label><select id="plan-unit" name="unit"><option value="general">General study</option>${unitOptions(p?.unit||'general',false)}</select></div><div class="split-fields"><div class="field"><label for="plan-date">Date</label><input id="plan-date" name="date" type="date" required value="${p?.date||selectedDate}"></div><div class="field"><label for="plan-minutes">Minutes</label><input id="plan-minutes" name="minutes" type="number" min="5" max="180" step="5" required value="${p?.minutes||15}"></div></div><div class="modal-actions"><button type="button" class="btn secondary" data-action="close-modal">Cancel</button><button class="btn" type="submit">Save session</button></div></form>`,()=>$('#plan-form').addEventListener('submit',ev=>{ev.preventDefault();const form=new FormData(ev.target),title=String(form.get('title')).trim();if(!title){$('#plan-title').setCustomValidity('Give your session a short title.');$('#plan-title').reportValidity();return;}const data={id:p?.id||crypto.randomUUID(),title,unit:form.get('unit'),date:form.get('date'),minutes:Number(form.get('minutes')),done:p?.done||false};if(p)state.plans[state.plans.indexOf(p)]=data;else state.plans.push(data);selectedDate=data.date;const monday=weekDays()[0];weekOffset=Math.floor((new Date(selectedDate+'T12:00:00')-new Date(monday+'T12:00:00'))/86400000/7);save();closeModal();render();toast('A little time, set aside.');}));$('#plan-title').addEventListener('input',ev=>ev.target.setCustomValidity(''));}
function addCardDialog(){modal('A new word for your collection',`<form id="card-form" class="form-stack"><div class="field"><label for="card-front">German word or phrase</label><input id="card-front" name="front" maxlength="300" required lang="de" placeholder="e.g. der Apfel"></div><div class="field"><label for="card-back">English meaning</label><input id="card-back" name="back" maxlength="300" required placeholder="e.g. apple"></div><div class="field"><label for="card-unit">Add to unit</label><select id="card-unit" name="unit">${unitOptions(units[0].id,false)}</select></div><div class="modal-actions"><button class="btn" type="submit">Add card</button></div></form>`,()=>$('#card-form').addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.target);if(!String(f.get('front')).trim()||!String(f.get('back')).trim()){toast('Please add both a word and its meaning.','error');return;}state.customCards.push({id:'custom-'+crypto.randomUUID(),front:String(f.get('front')).trim(),back:String(f.get('back')).trim(),unit:f.get('unit')});save();closeModal();render();toast('New word added to your collection.');}));}
function openSearch(){modal('Find a little inspiration',`<div class="field"><label for="global-search" class="sr-only">Search lessons and vocabulary</label><input id="global-search" type="search" placeholder="Search lessons, German words or meanings…" autofocus></div><div id="search-results" class="search-results"><p class="small muted">Try “1.2c”, “Schule” or “food”.</p></div>`,()=>$('#global-search').addEventListener('input',ev=>{const q=normalize(ev.target.value);if(!q){$('#search-results').innerHTML='<p class="small muted">Search across lessons and vocabulary.</p>';return;}const us=units.filter(u=>normalize(u.id+' '+u.title+' '+u.subtitle).includes(q)).slice(0,4),cs=allCards().filter(c=>normalize(c.front+' '+c.back).includes(q)).slice(0,8);$('#search-results').innerHTML=us.map(u=>`<button class="search-result" data-action="lesson" data-id="${u.id}">${icon('book')}<div><strong>${u.id} · ${e(u.title)}</strong><small>${e(u.subtitle)} · Lesson</small></div></button>`).join('')+cs.map(c=>`<button class="search-result" data-action="search-card" data-id="${e(c.id)}">${icon('cards')}<div><strong>${e(c.front)}</strong><small>${e(c.back)}</small></div></button>`).join('')||'<p class="muted small">No matches. Try a shorter word or its English meaning.</p>';}));}
function speak(text){if(!('speechSynthesis'in window)){toast('This browser does not support pronunciation.','error');return;}const voices=speechSynthesis.getVoices(),voice=voices.find(v=>v.lang.toLowerCase().startsWith('de'));if(!voice){toast('No German voice is available in this browser.','error');return;}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(text);utter.lang='de-DE';utter.voice=voice;utter.rate=.85;utter.onerror=()=>toast('Pronunciation is unavailable right now.','error');speechSynthesis.speak(utter);}
function updateTimerDisplay(){const seconds=timer.running?Math.max(0,Math.ceil((timer.deadline-Date.now())/1000)):timer.seconds;$$('[data-timer-display]').forEach(el=>el.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`);$$('[data-timer-status]').forEach(el=>el.textContent=timer.running?'You’re making room to learn.':'One thing at a time.');$$('[data-timer-toggle]').forEach(el=>el.innerHTML=icon(timer.running?'pause':'play')+(timer.running?' Pause':' Start focus'));$$('[data-action="timer-preset"]').forEach(el=>el.classList.toggle('active',Number(el.dataset.minutes)===timer.duration));}
setInterval(()=>{if(timer.running&&Date.now()>=timer.deadline){timer.running=false;timer.seconds=0;state.focusMinutes+=timer.duration;const earned=award(state,'focus:'+localDay(),Math.min(50,timer.duration*2));addSession('focus',`${timer.duration} minutes of focus`,earned);save();toast(`Focus complete. Take a breath. +${earned} XP`);render();}updateTimerDisplay();},500);
function exportBackup(){const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=`lernraum-backup-${localDay()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Your backup is ready.');}
async function importBackup(file){if(!file)return;if(file.size>5*1024*1024){toast('That file is too large. Choose a Lernraum JSON backup under 5 MB.','error');return;}try{const restored=validateState(JSON.parse(await file.text()));modal('Restore your study space?',`<p>This backup contains <b>${restored.xp} XP</b>, <b>${restored.plans.length} planned sessions</b> and <b>${restored.customCards.length} personal cards</b>. It will replace your current progress in this browser.</p><div class="modal-actions"><button class="btn secondary" data-action="close-modal">Cancel</button><button class="btn" id="confirm-restore">Restore backup</button></div>`,()=>$('#confirm-restore').addEventListener('click',()=>{state=restored;session=null;quiz=null;save();closeModal();render();toast('Your study space has been restored.');}));}catch(err){toast(err.message||'Could not read that backup.','error');}}
function confirmReset(){modal('A fresh start?',`<p>This removes all saved progress, planned sessions, preferences and personal cards from this browser. Export a backup first if you want to keep a copy.</p><div class="modal-actions"><button class="btn secondary" data-action="close-modal">Keep my progress</button><button class="btn danger" id="confirm-reset">Reset everything</button></div>`,()=>$('#confirm-reset').addEventListener('click',()=>{state=initialState();session=null;quiz=null;timer={seconds:1500,duration:25,deadline:null,running:false};save();closeModal();render();toast('A fresh page. Your space is ready.');}));}
function endSession(kind){const current=kind==='review'?session:quiz;if(!current)return;const finish=()=>{if(current.index>0||current.xp>0)addSession(kind==='review'?'review':'quiz','Partial '+(kind==='review'?'flashcard review':'practice session'),current.xp);if(kind==='review')session=null;else quiz=null;save();closeModal();render();};modal('Finish for now?',`<p>Your earned XP and reviewed cards are already saved. You can start a fresh session whenever you’re ready.</p><div class="modal-actions"><button class="btn secondary" data-action="close-modal">Keep studying</button><button class="btn" id="end-session">End session</button></div>`,()=>$('#end-session').addEventListener('click',finish));}
function bindPage(){
 $('#unit-search')?.addEventListener('input',ev=>{librarySearch=ev.target.value;$('#library-grid').innerHTML=filteredUnits();});
 $('#chapter-filter')?.addEventListener('change',ev=>{libraryChapter=ev.target.value;$('#library-grid').innerHTML=filteredUnits();});
 $('#review-unit')?.addEventListener('change',ev=>{reviewUnit=ev.target.value;$('#review-summary').textContent=reviewSummary();});
 $('#review-size')?.addEventListener('change',ev=>reviewSize=ev.target.value);
 $('#review-mode')?.addEventListener('change',ev=>reviewMode=ev.target.value);
 $('#practice-unit')?.addEventListener('change',ev=>practiceUnit=ev.target.value);
 $('#practice-mode')?.addEventListener('change',ev=>practiceMode=ev.target.value);
 $('#quiz-answer')?.addEventListener('input',ev=>{quiz.answer=ev.target.value;$('[data-action="check-answer"]').disabled=!quiz.answer.trim();});
 $('#settings-form')?.addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.target);state.profile={name:String(f.get('name')).trim(),goal:Number(f.get('goal')),theme:f.get('theme')};save();render();toast('Your space, just how you like it.');});
 $('#import-file')?.addEventListener('change',ev=>importBackup(ev.target.files[0]));
}
document.addEventListener('click',ev=>{if(ev.target.closest('.skip-link')){ev.preventDefault();$('#main').focus();return;}const target=ev.target.closest('[data-action]');if(!target||target.disabled)return;const a=target.dataset.action,id=target.dataset.id;
 switch(a){
 case'writing-guide':closeModal();openWriting(id);break;
 case'finish-writing':{const u=unitById(id);if(!u)break;const before=state.xp,earned=award(state,'writing:'+id,30);if(earned)addSession('writing','Notebook · '+u.title,earned);save();closeModal();render();rewardNotice(earned,before);break;}
 case'menu':menuOpen=!menuOpen;$('.sidebar').classList.toggle('open',menuOpen);$('.menu-scrim').classList.toggle('show',menuOpen);$('.mobile-menu')?.setAttribute('aria-expanded',menuOpen);break;
 case'settings':navigate('settings');break;
 case'source-info':modal('Your textbook, your scope',`<div class="source-detail"><b>${e(source.title)}</b><br>Lessons through 1.4d; vocabulary from printed pages 42–45.<br><br>${e(source.note)}<br><br>Included: 1.1a–d (home), 1.2a–d (school), 1.3a–c (food), and 1.4a–d (health). There is no 1.3d in the book. Activities are original revision material aligned to these sections, not reproductions of every publisher exercise.</div>`);break;
 case'search':openSearch();break;
 case'close-modal':closeModal();break;
 case'lesson':openLesson(id);break;
 case'complete-lesson':{const before=state.xp,earned=completeLesson(state,id);if(earned)addSession('lesson',id+' · '+unitById(id).title,earned);save();closeModal();rewardNotice(earned,before);render();break;}
 case'lesson-practice':practiceUnit=id;practiceMode='mixed';quiz=null;closeModal();navigate('practice');break;
 case'lesson-cards':reviewUnit=id;reviewMode='all';session=null;closeModal();navigate('flashcards');break;
 case'add-card':addCardDialog();break;
 case'delete-card':{const c=state.customCards.find(c=>c.id===id);if(!c)break;modal('Remove this card?',`<p>Remove <b>${e(c.front)}</b> from your collection? Your earned XP will stay.</p><div class="modal-actions"><button class="btn secondary" data-action="close-modal">Keep card</button><button class="btn danger" id="delete-custom">Remove card</button></div>`,()=>$('#delete-custom').addEventListener('click',()=>{state.customCards=state.customCards.filter(c=>c.id!==id);delete state.reviews[id];save();closeModal();render();}));break;}
 case'start-review':startReview();break;
 case'flip':if(session&&!session.finished){session.flipped=!session.flipped;render();}break;
 case'grade':gradeCard(target.dataset.grade);break;
 case'review-again':session=null;render();break;
 case'exit-review':endSession('review');break;
 case'flag-card':{const c=session.items[session.index];state.reviews[c.id]??={interval:0,repetitions:0,due:localDay(),last:localDay(),mastered:false,difficult:false};state.reviews[c.id].difficult=!state.reviews[c.id].difficult;save();render();break;}
 case'speak':speak(target.dataset.text);break;
 case'search-card':{const c=allCards().find(c=>c.id===id);session={items:[c],index:0,flipped:false,xp:0,known:0,finished:false};closeModal();navigate('flashcards');break;}
 case'start-quiz':startQuiz();break;
 case'quiz-again':quiz=null;render();break;
 case'retry-mistakes':startQuiz([...quiz.mistakes]);break;
 case'exit-quiz':endSession('quiz');break;
 case'choose':if(!quiz.checked){quiz.answer=quiz.options[Number(target.dataset.index)];render();}break;
 case'add-word':if(!quiz.checked&&!quiz.selectedWords.includes(Number(target.dataset.index))){quiz.selectedWords.push(Number(target.dataset.index));quiz.answer=quiz.selectedWords.map(i=>quiz.items[quiz.index].answers[i]).join(' ');render();}break;
 case'remove-word':if(!quiz.checked){quiz.selectedWords.splice(Number(target.dataset.index),1);quiz.answer=quiz.selectedWords.map(i=>quiz.items[quiz.index].answers[i]).join(' ');render();}break;
 case'insert-char':{const field=$('#quiz-answer');if(field&&!quiz.checked){field.setRangeText(target.dataset.char,field.selectionStart,field.selectionEnd,'end');quiz.answer=field.value;field.focus();$('[data-action="check-answer"]').disabled=!quiz.answer.trim();}break;}
 case'check-answer':checkAnswer();break;
 case'next-question':nextQuestion();break;
 case'add-plan':planDialog();break;
 case'edit-plan':planDialog(id);break;
 case'delete-plan':{const index=state.plans.findIndex(p=>p.id===id);if(index<0)break;const p=state.plans[index];modal('Remove this session?',`<p>Remove <b>${e(p.title)}</b> from your plan?</p><div class="modal-actions"><button class="btn secondary" data-action="close-modal">Keep session</button><button class="btn danger" id="delete-session">Remove session</button></div>`,()=>$('#delete-session').addEventListener('click',()=>{state.plans.splice(index,1);save();closeModal();render();}));break;}
 case'toggle-plan':{const p=state.plans.find(p=>p.id===id);if(p){p.done=!p.done;save();render();}break;}
 case'prev-week':weekOffset--;selectedDate=weekDays(weekOffset)[0];render();break;
 case'next-week':weekOffset++;selectedDate=weekDays(weekOffset)[0];render();break;
 case'today':weekOffset=0;selectedDate=localDay();render();break;
 case'select-date':selectedDate=target.dataset.date;render();break;
 case'focus-modal':modal('Find your focus',timerHTML());updateTimerDisplay();break;
 case'timer-toggle':if(timer.running){timer.seconds=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));timer.running=false;}else{if(timer.seconds<=0)timer.seconds=timer.duration*60;timer.deadline=Date.now()+timer.seconds*1000;timer.running=true;}updateTimerDisplay();break;
 case'timer-reset':timer.running=false;timer.seconds=timer.duration*60;timer.deadline=null;updateTimerDisplay();break;
 case'timer-preset':timer.duration=Number(target.dataset.minutes);timer.seconds=timer.duration*60;timer.running=false;timer.deadline=null;updateTimerDisplay();break;
 case'export':exportBackup();break;
 case'import':$('#import-file').click();break;
 case'reset-data':confirmReset();break;
 }
});
document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();openSearch();return;}if($('dialog[open]'))return;const isInput=/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName);if(ev.key==='Enter'&&ev.target.id==='quiz-answer'){ev.preventDefault();checkAnswer();return;}if(isInput)return;if(route==='flashcards'&&session&&!session.finished){if(ev.code==='Space'){ev.preventDefault();session.flipped=!session.flipped;render();}if(session.flipped&&['1','2','3'].includes(ev.key)){ev.preventDefault();gradeCard({1:'again',2:'hard',3:'good'}[ev.key]);}}});
window.addEventListener('storage',ev=>{if(ev.key===STORAGE_KEY){const result=loadState(localStorage);if(!result.error){state=result.state;session=null;quiz=null;render();toast('Progress updated from another tab.');}}});
render();
</script>
</head>
